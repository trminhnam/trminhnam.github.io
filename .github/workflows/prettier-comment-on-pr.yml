name: Comment on pull request

on:
  repository_dispatch:
    types: [prettier-failed-on-pr]

jobs:
  comment:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: PR comment with html diff 💬
        # thollander/actions-comment-pull-request has no Node 24 release, so this upserts the comment itself, reusing
        # its marker so comments it already posted are updated rather than duplicated.
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          MESSAGE: |
            Failed [prettier code check](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.client_payload.run_id }}). Check [this file](${{ github.event.client_payload.artifact_url }}) for more information.
        with:
          script: |
            const marker = '<!-- thollander/actions-comment-pull-request "prettier-failed" -->';
            const body = `${process.env.MESSAGE}\n${marker}`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
