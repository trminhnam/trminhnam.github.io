name: Docker Slim

#Only trigger, when the build workflow succeeded
on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/docker-slim.yml"
  workflow_run:
    workflows: ["Docker Image CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'alshedivat' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: update docker-compose
        shell: bash
        run: |
          sed -i "s|\.:|${{ github.workspace }}:|g" ${{ github.workspace }}/docker-compose.yml
          cat ${{ github.workspace }}/docker-compose.yml

      # kitabisa/docker-slim-action has no Node 24 release, so this does what it did: install the latest slim release
      # and build a slimmed copy of the target image.
      - name: Slim the image
        env:
          DSLIM_PULL: true
          DSLIM_COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml
          DSLIM_TARGET_COMPOSE_SVC: jekyll
          DSLIM_CONTINUE_AFTER: signal
          GH_TOKEN: ${{ github.token }}
        run: |
          SLIM_VERSION=$(gh api repos/slimtoolkit/slim/releases/latest --jq .tag_name)
          curl -fsSL "https://github.com/slimtoolkit/slim/releases/download/$SLIM_VERSION/dist_linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          ./dist_linux/slim build --target amirpourmand/al-folio --tag amirpourmand/al-folio:slim

      # Push to the registry
      - run: docker image push amirpourmand/al-folio:slim
